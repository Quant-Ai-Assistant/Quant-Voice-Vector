[package]
name = "qvv-core"
description = "Audio to .qvoice.json: decoding, VAD, speaker embeddings, profile export"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Must stay on the same version as sherpa-onnx-node in Quant-Core: vectors are only comparable then.
sherpa-onnx = "=1.13.8"
symphonia = { version = "0.6", features = ["all-codecs", "all-formats"] }
symphonia-adapter-libopus = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting"] }
